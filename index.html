<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./index.js"></script>
    <title>Task Management App</title>
</head>

<body>
    <div class="container">
        <table>
            <tr>
                <th>Task Name</th>
                <th>Category</th>
                <th>Due Date</th>
                <th>Status</th>
            </tr>
            <tbody id="task-table-el"></tbody>
            <tr>
                <td><input id="new-task-el" type="text" placeholder="New Task" /></td>
                <td>
                    <select id="new-category-el">
                        <option value="">--Category--</option>
                        <option value="Work">Work</option>
                        <option value="Volunteer">Volunteer</option>
                        <option value="Family">Family</option>
                        <option value="Personal">Personal</option>
                    </select>
                </td>
                <td><input id="new-date-el" type="date" placeholder="MM/DD/YYYY" /></td>
                <td>
                    <select id="new-status-el"">
                        <option value="">--Status--</option>
                        <option value=" In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                        <option value="Overdue">Overdue</option>
                    </select>
                </td>
            </tr>
        </table>
        <button id="add-button-el">Add task</button>
        <button id="overdue-button-el">Check for overdue tasks</button>
    </div>
